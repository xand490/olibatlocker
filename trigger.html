<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦇</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 30vw;
    }
  </style>
</head>
<body>
  🦇
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <script>
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'trig_' + Math.random().toString(16).substr(2, 8),
      clean: true
    });
    client.on('connect', () => {
      client.publish('olibatlocker', 'play', { qos: 1 }, () => client.end());
    });
  </script>
</body>
</html>
