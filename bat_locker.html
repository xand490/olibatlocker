<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>🦇</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #06060f;
      --surface:  #0d0d1a;
      --purple:   #8b7fff;
      --orange:   #ff8c42;
      --dim:      #3a3a5c;
      --glow:     #8b7fff44;
    }

    body {
      background: var(--bg);
      color: var(--purple);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Cave texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, #1a0f3322 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 100%, #0f0a2222 0%, transparent 60%);
      pointer-events: none;
    }

    /* Scanline effect */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
    }

    /* ── SONAR ── */
    .sonar-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      margin-bottom: 28px;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--purple);
      opacity: 0;
      width: 60px;
      height: 60px;
    }

    .ring.active {
      animation: sonar 2.4s ease-out infinite;
    }

    .ring:nth-child(2).active { animation-delay: 0.8s; }
    .ring:nth-child(3).active { animation-delay: 1.6s; }

    @keyframes sonar {
      0%   { opacity: 0;   width: 60px;  height: 60px; }
      10%  { opacity: 0.5; }
      100% { opacity: 0;   width: 200px; height: 200px; }
    }

    .bat-glyph {
      font-size: 52px;
      line-height: 1;
      z-index: 2;
      transition: filter 0.2s;
    }

    .bat-glyph.transmitting {
      filter: drop-shadow(0 0 12px var(--orange));
      animation: flicker 0.15s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from { opacity: 0.85; }
      to   { opacity: 1; }
    }

    /* ── LABELS ── */
    .label {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 32px;
      min-height: 16px;
    }

    .label.active { color: var(--purple); }

    /* ── MORSE DISPLAY ── */
    .morse-grid {
      display: flex;
      gap: 14px;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 36px;
      min-height: 20px;
    }

    .digit-group {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .pip {
      background: var(--dim);
      border-radius: 2px;
      transition: background 0.04s, box-shadow 0.04s;
    }

    .pip.dot  { width: 7px;  height: 7px;  border-radius: 50%; }
    .pip.dash { width: 22px; height: 7px; }

    .pip.lit {
      background: var(--orange);
      box-shadow: 0 0 8px var(--orange), 0 0 2px var(--orange);
    }

    /* ── BUTTON ── */
    .btn {
      background: transparent;
      color: var(--purple);
      border: 1px solid var(--dim);
      padding: 13px 40px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      cursor: pointer;
      display: block;
      margin: 8px auto;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover, .btn:active {
      border-color: var(--purple);
      box-shadow: 0 0 12px var(--glow);
    }

    .btn.ghost {
      color: var(--dim);
      font-size: 10px;
      padding: 9px 28px;
      letter-spacing: 4px;
    }

    .btn.ghost:hover { color: var(--purple); border-color: var(--purple); }

    /* ── TRIGGER PAGE ── */
    .trigger-icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: block;
    }

    .trigger-status {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .trigger-status.sent { color: #4dffa0; }
    .trigger-status.error { color: #ff6b6b; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-up { animation: fadeUp 0.5s ease forwards; }

    /* ── REPEAT COUNTER ── */
    .rep-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
      min-height: 10px;
    }

    .rep-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dim);
      transition: background 0.3s;
    }

    .rep-dot.done { background: var(--purple); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script>
var WORDS   = ["SEVEN","TWO","EIGHT","NINE"];
var params  = new URLSearchParams(window.location.search);
var TOPIC   = params.get("topic") || "olibatlocker";
var MQTT_BROKER = "wss://broker.hivemq.com:8884/mqtt";
var TRIGGER = params.get("mode") === "trigger";
var SPLIT_TIMES = [0,19.98,39.75,60.07,80.43,99.30,118.28];
var AUDIO_URL = "./bats.mp3";
var MORSE_URL = "./morse.mp3";

var fullBuffer=null,chunks=[],morseBuffer=null,ctx=null;
var cycleOn=false,armed=false;

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

async function resumeCtx(){
  if(ctx&&ctx.state==="suspended") await ctx.resume();
}

function playBuffer(buffer){
  return new Promise(function(resolve){
    var done=false;
    function finish(){if(!done){done=true;resolve();}}
    resumeCtx().then(function(){
      var src=ctx.createBufferSource();
      src.buffer=buffer;
      src.connect(ctx.destination);
      src.start();
      src.onended=finish;
      setTimeout(finish,buffer.duration*1000+800);
    });
  });
}

async function loadAudio(){
  // Load bat audio (required)
  setLabel("loading bats...");
  var r1=await fetch(AUDIO_URL);
  var ab1=await r1.arrayBuffer();
  fullBuffer=await new Promise(function(res,rej){ctx.decodeAudioData(ab1,res,rej);});
  var sr=fullBuffer.sampleRate; chunks=[];
  for(var i=0;i<SPLIT_TIMES.length-1;i++){
    var s=Math.floor(SPLIT_TIMES[i]*sr),e=Math.floor(SPLIT_TIMES[i+1]*sr);
    var chunk=ctx.createBuffer(fullBuffer.numberOfChannels,e-s,sr);
    for(var ch=0;ch<fullBuffer.numberOfChannels;ch++)
      chunk.getChannelData(ch).set(fullBuffer.getChannelData(ch).subarray(s,e));
    chunks.push(chunk);
  }
  // Load morse audio (optional — falls back to silence if missing)
  setLabel("loading morse...");
  try{
    var r2=await fetch(MORSE_URL);
    var ab2=await r2.arrayBuffer();
    morseBuffer=await new Promise(function(res,rej){ctx.decodeAudioData(ab2,res,rej);});
  }catch(e){
    console.warn("morse.mp3 not loaded:",e);
    morseBuffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); // 2s silence fallback
  }
}

function setLabel(txt,active){
  var el=document.getElementById("lbl");
  el.textContent=txt;
  el.classList.toggle("active",!!active);
}
function setPhase(id){
  ["chunk","morse"].forEach(function(p){
    var el=document.getElementById("phase-"+p);
    if(el)el.classList.remove("done");
  });
  if(id){var ea=document.getElementById("phase-"+id);if(ea)ea.classList.add("done");}
}
function activateSonar(){
  ["r1","r2","r3"].forEach(function(id){
    document.getElementById(id).classList.add("active");
  });
}

async function startCycle(){
  cycleOn=true;
  var chunkIdx=0;
  setPhase("chunk"); setLabel("ambient");
  await playBuffer(chunks[0]);
  setPhase("morse"); setLabel("transmitting",true);
  await playBuffer(morseBuffer);
  await sleep(2000);
  chunkIdx=1;
  while(cycleOn){
    try{
      setPhase("chunk"); setLabel("ambient");
      await playBuffer(chunks[chunkIdx%chunks.length]);
      setPhase("morse"); setLabel("transmitting",true);
      await playBuffer(morseBuffer);
      await sleep(2000);
      chunkIdx++;
    }catch(e){console.error("cycle err",e);}
  }
}

function initListen(){
  var root=document.getElementById("root");
  root.innerHTML=
    '<div class="sonar-wrap" id="sonar">' +
      '<div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="ring" id="r3"></div>' +
      '<span class="bat-glyph" id="bat">&#x1F987;</span>' +
    '</div>' +
    '<div class="label" id="lbl">tap to arm</div>' +
    '<div class="rep-dots" id="rep-dots"></div>' +
    '<button class="btn" id="arm-btn">arm</button>' +
    '<button class="btn ghost" id="test-btn" style="display:none">test</button>';

  var repDots=document.getElementById("rep-dots");
  ["chunk","morse"].forEach(function(id){
    var d=document.createElement("div");
    d.className="rep-dot"; d.id="phase-"+id;
    repDots.appendChild(d);
  });

  function arm(){
    if(armed)return; armed=true;
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    document.getElementById("arm-btn").style.display="none";
    setLabel("loading audio...");
    activateSonar();
    loadAudio().then(function(){
      setLabel("armed -- waiting for signal");
      document.getElementById("test-btn").style.display="block";
      var client=mqtt.connect(MQTT_BROKER,{clientId:"bat_"+Math.random().toString(16).substr(2,8),clean:true});
      client.on("connect",function(){client.subscribe(TOPIC);});
      client.on("message",function(){if(!cycleOn)startCycle();});
      client.on("error",function(){setLabel("connection error -- reload");});
      client.on("offline",function(){setLabel("connection lost -- reload");});
    }).catch(function(e){setLabel("load failed");console.error(e);});
  }

  document.getElementById("arm-btn").addEventListener("click",arm);
  document.getElementById("test-btn").addEventListener("click",function(){
    if(!cycleOn&&ctx){
      setPhase("chunk"); setLabel("ambient");
      playBuffer(chunks[0]).then(function(){
        setPhase("morse"); setLabel("transmitting",true);
        return playBuffer(morseBuffer);
      }).then(function(){setPhase(null);setLabel("armed -- waiting for signal");});
    }
  });
}

function initTrigger(){
  var root=document.getElementById("root");
  root.innerHTML='<span class="trigger-icon">&#x1F987;</span><div class="trigger-status" id="tstatus">sending signal...</div>';
  var client=mqtt.connect(MQTT_BROKER,{clientId:"trig_"+Math.random().toString(16).substr(2,8),clean:true});
  client.on("connect",function(){
    client.publish(TOPIC,"play",{qos:1},function(err){
      var s=document.getElementById("tstatus");
      if(err){s.className="trigger-status error";s.textContent="failed -- check connection";}
      else{s.className="trigger-status sent fade-up";s.innerHTML="signal sent<br><br>listen carefully...";}
      client.end();
    });
  });
  client.on("error",function(){
    var s=document.getElementById("tstatus");
    s.className="trigger-status error";s.textContent="failed -- check connection";
  });
}

TRIGGER?initTrigger():initListen();
</script>

</body>
</html>
